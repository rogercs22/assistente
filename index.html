<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<title>Assistente de Playlist</title>
<style>
  /* ===== CORES (tema escuro estilo Spotify) ===== */
  :root{
    --fundo:#121212; --cartao:#1e1e1e; --borda:#2c2c2c;
    --texto:#f2f2f2; --suave:#a7a7a7; --verde:#1db954; --vermelho:#e5534b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--texto);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
  main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
  h1{font-size:22px;margin:4px 0 2px}
  .sub{color:var(--suave);font-size:14px;margin:0 0 16px}
  .cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:14px;padding:14px;margin-bottom:14px}
  .cartao h2{font-size:16px;margin:0 0 10px}
  label{display:block;font-size:13px;color:var(--suave);margin:10px 0 4px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--borda);
    background:#0f0f0f;color:var(--texto);font-size:16px}
  button{font:inherit;border:0;border-radius:999px;padding:12px 16px;cursor:pointer}
  .btn-verde{background:var(--verde);color:#000;font-weight:700;width:100%;margin-top:12px}
  .btn-cinza{background:#2a2a2a;color:var(--texto)}
  .uri{font-family:monospace;font-size:13px;background:#0f0f0f;padding:10px;border-radius:8px;word-break:break-all}
  .linha{display:flex;gap:8px;align-items:center}
  .oculto{display:none!important}
  /* ===== CONVERSA ===== */
  #conversa{display:flex;flex-direction:column;gap:8px;max-height:45vh;overflow-y:auto}
  .balao{padding:10px 12px;border-radius:14px;max-width:85%;line-height:1.35}
  .assistente{background:#2a2a2a;align-self:flex-start}
  .voce{background:var(--verde);color:#000;align-self:flex-end}
  .erro{color:var(--vermelho);font-size:13px}
  /* ===== TOCANDO AGORA ===== */
  #tocando .musica{font-weight:700}
  #tocando .artista{color:var(--suave);font-size:14px}
  .acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  /* ===== BOTAO DO MICROFONE ===== */
  #barra{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--fundo) 30%);
    padding:24px 16px 18px;display:flex;justify-content:center;align-items:center;gap:14px}
  #mic{width:76px;height:76px;border-radius:50%;background:var(--verde);color:#000;font-size:32px;
    box-shadow:0 4px 18px rgba(29,185,84,.35)}
  #mic.ouvindo{background:var(--vermelho);animation:pulsa 1s infinite}
  @keyframes pulsa{50%{transform:scale(1.08)}}
  .chave{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--suave)}
  .chave input{width:auto}
</style>
</head>
<body>
<main>
  <h1>🎵 Assistente de Playlist</h1>
  <p class="sub" id="status">Carregando…</p>

  <!-- ===== CARTAO DE CONFIGURACAO (aparece so quando nao esta conectado) ===== -->
  <section class="cartao oculto" id="configuracao">
    <h2>1. Conectar ao Spotify</h2>
    <label>Cole este endereço no seu app do Spotify for Developers, em "Redirect URIs":</label>
    <div class="linha">
      <div class="uri" id="redirectTexto" style="flex:1"></div>
      <button class="btn-cinza" id="copiar">Copiar</button>
    </div>
    <label for="clientId">Client ID do seu app (o Secret NÃO é necessário):</label>
    <input id="clientId" placeholder="cole aqui o Client ID" autocomplete="off">
    <button class="btn-verde" id="conectar">Conectar Spotify</button>
    <p class="erro" id="erroLogin"></p>
  </section>

  <!-- ===== AJUSTES ===== -->
  <section class="cartao" id="ajustes">
    <h2>Nome do assistente</h2>
    <input id="nomeAssistente" placeholder="Ex: Gabriel">
    <p class="sub" style="margin:8px 0 0">No modo mãos livres, ele só responde quando ouve esse nome.</p>
  </section>

  <!-- ===== TOCANDO AGORA ===== -->
  <section class="cartao oculto" id="tocando">
    <div class="sub" id="nomePlaylist" style="margin:0 0 6px"></div>
    <div class="musica" id="nomeMusica">—</div>
    <div class="artista" id="nomeArtista"></div>
    <div class="acoes">
      <button class="btn-verde" style="margin:0" data-acao="adiciona">➕ Adicionar</button>
      <button class="btn-cinza" data-acao="próxima">⏭ Próxima</button>
      <button class="btn-cinza" data-acao="outro artista">🎤 Outro artista</button>
      <button class="btn-cinza" data-acao="terminar">⏹ Terminar</button>
    </div>
  </section>

  <!-- ===== CONVERSA ===== -->
  <section class="cartao">
    <div id="conversa"></div>
    <p class="erro" id="erroGeral"></p>
  </section>

  <p class="sub" style="text-align:center">
    <a href="#" id="desconectar" style="color:var(--suave)">Desconectar Spotify</a>
  </p>
</main>

<!-- ===== BARRA DE BAIXO: MICROFONE + MAOS LIVRES ===== -->
<div id="barra">
  <label class="chave"><input type="checkbox" id="maosLivres"> Mãos livres</label>
  <button id="mic" aria-label="Falar">🎤</button>
  <span style="width:96px"></span>
</div>

<script>
/* =====================================================================
   ASSISTENTE DE PLAYLIST POR VOZ
   - Ouve sua voz (reconhecimento de fala do próprio Chrome)
   - Responde falando (voz do próprio celular)
   - Cria playlist, busca músicas, toca e adiciona no Spotify
   ===================================================================== */

/* ---------- 1. CONFIGURAÇÕES FIXAS ---------- */

// Permissões que pedimos ao Spotify:
// criar/editar playlists e controlar o player (tocar, pausar, pular)
const ESCOPOS = [
  'playlist-modify-private',
  'playlist-modify-public',
  'user-modify-playback-state',
  'user-read-playback-state'
].join(' ');

// Endereço de volta depois do login = o endereço desta própria página
// (tiramos o "index.html" do final pra bater certinho com o cadastrado no Spotify)
const REDIRECT_URI = location.origin + location.pathname.replace(/index\.html$/, '');

// Endereço base da API do Spotify
const API = 'https://api.spotify.com/v1';


/* ---------- 2. GUARDAR E LER DADOS NO CELULAR ---------- */
// Usamos try/catch porque em aba anônima o armazenamento pode falhar

function salvar(chave, valor) {
  try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) {}
}
function ler(chave, padrao) {
  try {
    const v = localStorage.getItem(chave);
    return v === null ? padrao : JSON.parse(v);
  } catch (e) { return padrao; }
}


/* ---------- 3. A "MEMÓRIA" DA CONVERSA ---------- */
// É aqui que o assistente lembra em que ponto a conversa está,
// qual playlist foi criada, qual artista e qual música está tocando.

const memoria = {
  etapa: 'parado',        // parado | pedindo_nome | pedindo_artista | ouvindo_musicas
  playlist: null,         // { id, nome }
  artista: '',            // artista escolhido
  consulta: '',           // texto usado na busca do Spotify
  musicas: [],            // lista de músicas encontradas
  indice: 0,              // qual música da lista está tocando
  offset: 0,              // de onde continuar a busca (o Spotify devolve 10 por vez)
  adicionadas: new Set()  // músicas já colocadas na playlist (pra não repetir)
};


/* ---------- 4. LOGIN NO SPOTIFY (PKCE, sem precisar do Secret) ---------- */

// Gera um texto aleatório (é tipo uma senha descartável do login)
function textoAleatorio(tamanho) {
  const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const numeros = crypto.getRandomValues(new Uint8Array(tamanho));
  return Array.from(numeros, n => letras[n % letras.length]).join('');
}

// Transforma o texto num "carimbo" SHA-256 no formato que o Spotify pede
async function carimbo(texto) {
  const dados = new TextEncoder().encode(texto);
  const hash = await crypto.subtle.digest('SHA-256', dados);
  return btoa(String.fromCharCode(...new Uint8Array(hash)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

// Manda você pra tela de login do Spotify
async function conectarSpotify() {
  const clientId = document.getElementById('clientId').value.trim();
  if (!clientId) { mostrarErro('erroLogin', 'Cole o Client ID primeiro.'); return; }
  salvar('clientId', clientId);

  const verificador = textoAleatorio(64);
  salvar('verificador', verificador);

  const params = new URLSearchParams({
    response_type: 'code',
    client_id: clientId,
    scope: ESCOPOS,
    code_challenge_method: 'S256',
    code_challenge: await carimbo(verificador),
    redirect_uri: REDIRECT_URI
  });
  location.href = 'https://accounts.spotify.com/authorize?' + params;
}

// Quando o Spotify devolve você pra cá com um "code", trocamos ele pelo token de acesso
async function trocarCodigoPorToken(code) {
  const corpo = new URLSearchParams({
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    client_id: ler('clientId', ''),
    code_verifier: ler('verificador', '')
  });
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: corpo
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.error || 'Falha no login');
  guardarToken(d);
}

// Guarda o token e calcula quando ele vence (vence em 1 hora)
function guardarToken(d) {
  const antigo = ler('token', null) || {};
  salvar('token', {
    acesso: d.access_token,
    renovar: d.refresh_token || antigo.renovar,
    expira: Date.now() + (d.expires_in - 60) * 1000
  });
}

// Devolve um token válido; se venceu, renova sozinho
async function tokenValido() {
  const t = ler('token', null);
  if (!t || !t.acesso) return null;
  if (Date.now() < t.expira) return t.acesso;

  const corpo = new URLSearchParams({
    grant_type: 'refresh_token',
    refresh_token: t.renovar,
    client_id: ler('clientId', '')
  });
  const r = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: corpo
  });
  const d = await r.json();
  if (!r.ok) { salvar('token', null); return null; }
  guardarToken(d);
  return d.access_token;
}

// Função "garçom": leva qualquer pedido pro Spotify e traz a resposta
async function spotify(metodo, caminho, corpo) {
  const token = await tokenValido();
  if (!token) throw new Error('SEM_LOGIN');

  const r = await fetch(API + caminho, {
    method: metodo,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  if (r.status === 204) return null;              // deu certo e não tem resposta

  const texto = await r.text();
  let d = null;
  try { d = texto ? JSON.parse(texto) : null; } catch (e) {}

  if (!r.ok) {
    const erro = new Error((d && d.error && d.error.message) || ('Erro ' + r.status));
    erro.status = r.status;
    erro.motivo = d && d.error && d.error.reason;
    throw erro;
  }
  return d;
}


/* ---------- 5. VOZ: FALAR E OUVIR ---------- */

const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
let reconhecedorAtual = null;   // o "ouvido" que está ligado no momento

// Escolhe uma voz em português, se o celular tiver
function vozPortugues() {
  const vozes = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  return vozes.find(v => (v.lang || '').toLowerCase() === 'pt-br')
      || vozes.find(v => (v.lang || '').toLowerCase().startsWith('pt'));
}

// Fala um texto e espera terminar de falar
function falar(texto) {
  adicionarBalao('assistente', texto);
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) { resolve(); return; }
    speechSynthesis.cancel();
    const fala = new SpeechSynthesisUtterance(texto);
    fala.lang = 'pt-BR';
    const voz = vozPortugues();
    if (voz) fala.voice = voz;

    let terminou = false;
    const fim = () => { if (!terminou) { terminou = true; resolve(); } };
    fala.onend = fim;
    fala.onerror = fim;
    // segurança: alguns Androids esquecem de avisar que terminou
    setTimeout(fim, texto.length * 95 + 2500);

    speechSynthesis.speak(fala);
  });
}

// Liga o microfone, ouve UMA frase e devolve o texto (ou null)
function ouvirUmaVez(mostrarNaTela = true) {
  return new Promise(resolve => {
    if (!Reconhecimento) { resolve(null); return; }
    const rec = new Reconhecimento();
    rec.lang = 'pt-BR';
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    let ouviu = null;
    rec.onresult = e => { ouviu = e.results[0][0].transcript; };
    rec.onerror = () => {};
    rec.onend = () => {
      if (reconhecedorAtual === rec) reconhecedorAtual = null;
      if (mostrarNaTela) indicarOuvindo(false);
      resolve(ouviu);
    };

    reconhecedorAtual = rec;
    if (mostrarNaTela) indicarOuvindo(true);
    try { rec.start(); } catch (e) { indicarOuvindo(false); resolve(null); }
  });
}

// Desliga o microfone se estiver ligado
function desligarOuvido() {
  if (reconhecedorAtual) { try { reconhecedorAtual.abort(); } catch (e) {} }
}


/* ---------- 6. FUNÇÕES DE TEXTO ---------- */

// Tira acentos, pontuação e deixa minúsculo: "Próxima!" vira "proxima"
function normalizar(s) {
  return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[^\w\s]/g, ' ').replace(/\s+/g, ' ').trim();
}

// Primeira letra maiúscula
function capitalizar(s) {
  s = (s || '').trim();
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// Limpa o nome da playlist: "o nome é Louvor da Manhã" vira "Louvor da Manhã"
function limparNome(texto) {
  return texto.replace(/^\s*(o nome (vai ser|e|é)|pode ser|vai se chamar|coloca|chama|nome)\s*/i, '').trim();
}

// Limpa o artista: "quero começar pela Adriana Arydes" vira "Adriana Arydes"
function limparArtista(texto) {
  return texto
    .replace(/^\s*(quero|vamos|pode)?\s*(começar|comecar)?\s*(pela|pelo|por|com)?\s*/i, '')
    .replace(/^\s*(a|o)\s+/i, '')
    .trim();
}

const esperar = ms => new Promise(r => setTimeout(r, ms));


/* ---------- 7. AÇÕES NO SPOTIFY ---------- */

// Começa a busca de músicas de um artista
async function carregarMusicas(artista) {
  memoria.artista = artista;
  memoria.consulta = `artist:"${artista}"`;   // busca filtrando pelo artista
  memoria.musicas = [];
  memoria.indice = 0;
  memoria.offset = 0;

  let achou = await buscarMais();
  if (!achou) {
    // se o filtro não achou (às vezes o nome sai diferente na voz), busca solto
    memoria.consulta = artista;
    memoria.offset = 0;
    achou = await buscarMais();
  }
  return achou;
}

// Busca mais 10 músicas (o Spotify só devolve 10 por vez desde 2026)
async function buscarMais() {
  const caminho = `/search?type=track&limit=10&market=BR&offset=${memoria.offset}` +
                  `&q=${encodeURIComponent(memoria.consulta)}`;
  const d = await spotify('GET', caminho);
  const itens = (d && d.tracks && d.tracks.items) || [];
  memoria.offset += 10;

  // evita música repetida (mesma música em álbum diferente)
  const vistos = new Set(memoria.musicas.map(m => normalizar(m.nome)));
  let novas = 0;
  for (const it of itens) {
    if (!it || !it.uri) continue;
    const chave = normalizar(it.name);
    if (vistos.has(chave)) continue;
    vistos.add(chave);
    memoria.musicas.push({
      uri: it.uri,
      nome: it.name,
      artistas: (it.artists || []).map(a => a.name).join(', ')
    });
    novas++;
  }
  return novas > 0;
}

// Toca uma música; se nenhum aparelho estiver ativo, tenta achar um
async function tocarUri(uri) {
  try {
    await spotify('PUT', '/me/player/play', { uris: [uri] });
  } catch (e) {
    if (e.status === 404 || e.motivo === 'NO_ACTIVE_DEVICE') {
      const d = await spotify('GET', '/me/player/devices');
      const aparelho = d && d.devices && d.devices[0];
      if (!aparelho) {
        await falar('Não achei o Spotify aberto. Abre o app do Spotify, dá play em qualquer música um segundinho e volta aqui.');
        throw new Error('SEM_APARELHO');
      }
      await spotify('PUT', `/me/player/play?device_id=${encodeURIComponent(aparelho.id)}`, { uris: [uri] });
    } else {
      throw e;
    }
  }
}

// Toca a música atual da lista
async function tocarAtual() {
  const m = memoria.musicas[memoria.indice];
  if (!m) return false;
  atualizarTela();
  await falar(`Tocando ${m.nome}.`);
  await tocarUri(m.uri);
  return true;
}

// Pula pra próxima música (busca mais se a lista acabou)
async function proxima() {
  memoria.indice++;
  if (memoria.indice >= memoria.musicas.length) {
    const achou = await buscarMais();
    if (!achou) {
      memoria.indice = memoria.musicas.length - 1;
      await falar(`Acabaram as músicas que encontrei de ${memoria.artista}. Fala "outro artista" ou "terminar".`);
      return;
    }
  }
  await tocarAtual();
}

// Coloca a música atual na playlist
async function adicionarAtual() {
  const m = memoria.musicas[memoria.indice];
  if (!m) return;
  if (memoria.adicionadas.has(m.uri)) { await falar('Essa já está na playlist.'); return; }
  await spotify('POST', `/playlists/${memoria.playlist.id}/items`, { uris: [m.uri] });
  memoria.adicionadas.add(m.uri);
  await falar(`Adicionei ${m.nome}.`);
}

// Pausar e voltar a tocar (se der erro, ignora, pra não travar a conversa)
async function pausar()  { try { await spotify('PUT', '/me/player/pause'); } catch (e) {} }
async function retomar() { try { await spotify('PUT', '/me/player/play'); } catch (e) {} }


/* ---------- 8. O "CÉREBRO": ENTENDE O QUE VOCÊ FALOU ---------- */
// Recebe sua frase e decide o que fazer conforme a etapa da conversa.
// Devolve: ouvirDeNovo (precisa da sua resposta?) e trocouMusica (não retomar a anterior)

async function processar(texto) {
  const t = normalizar(texto);

  // "cancela" funciona em qualquer etapa antes de tocar música
  if (/\b(cancela|cancelar)\b/.test(t) && memoria.etapa !== 'ouvindo_musicas') {
    memoria.etapa = 'parado';
    await falar('Tudo bem, cancelei.');
    return {};
  }

  switch (memoria.etapa) {

    case 'parado':
      if (t.includes('playlist') || t.includes('play list')) {
        memoria.etapa = 'pedindo_nome';
        await falar('Tudo bem! Qual seria o nome da playlist?');
        return { ouvirDeNovo: true };
      }
      await falar('Por enquanto eu sei montar playlists. É só falar: quero montar uma playlist.');
      return {};

    case 'pedindo_nome': {
      const nome = capitalizar(limparNome(texto));
      await falar(`Beleza! Vou criar a playlist ${nome}.`);
      const p = await spotify('POST', '/me/playlists', {
        name: nome,
        public: false,
        description: 'Criada pelo meu assistente de voz'
      });
      memoria.playlist = { id: p.id, nome };
      memoria.adicionadas = new Set();
      memoria.etapa = 'pedindo_artista';
      atualizarTela();
      await falar(`Foi criada a playlist ${nome}. Você quer começar por qual artista?`);
      return { ouvirDeNovo: true };
    }

    case 'pedindo_artista': {
      const artista = limparArtista(texto);
      const achou = await carregarMusicas(artista);
      if (!achou) {
        await falar(`Não achei músicas de ${artista}. Fala o nome de novo, ou outro artista.`);
        return { ouvirDeNovo: true };
      }
      memoria.etapa = 'ouvindo_musicas';
      await falar(`Beleza! Vou colocar pra você escutar as músicas de ${artista}. ` +
        `A que você quiser, fala "adiciona" que eu coloco na playlist. ` +
        `Se não quiser, fala "próxima" que eu pulo. Combinado?`);
      // espera o seu "ok, beleza" (qualquer resposta serve)
      const resposta = await ouvirUmaVez();
      if (resposta) adicionarBalao('voce', resposta);
      await tocarAtual();
      return { trocouMusica: true };
    }

    case 'ouvindo_musicas':
      // a ordem importa: "não quero essa" tem que pular, não adicionar
      if (/\b(proxima|pula|pular|passa|nao quero|nao gostei)\b/.test(t)) {
        await proxima();
        return { trocouMusica: true };
      }
      if (/\b(outro artista|outra artista|trocar artista|troca de artista|outro cantor|outra cantora)\b/.test(t)) {
        memoria.etapa = 'pedindo_artista';
        await falar('Qual artista agora?');
        return { ouvirDeNovo: true, trocouMusica: true };
      }
      if (/\b(terminar|termina|terminei|chega|finaliza|acabou|encerrar|parar)\b/.test(t)) {
        const total = memoria.adicionadas.size;
        await falar(`Pronto! A playlist ${memoria.playlist.nome} ficou com ${total} ` +
          `${total === 1 ? 'música' : 'músicas'}. Ela já está no seu Spotify.`);
        memoria.etapa = 'parado';
        atualizarTela();
        return { trocouMusica: true };
      }
      if (/\b(adiciona|adicionar|coloca|salva|quero essa|gostei|essa sim|pode adicionar)\b/.test(t)) {
        await adicionarAtual();
        return {};
      }
      await falar('Não entendi. Pode falar: adiciona, próxima, outro artista ou terminar.');
      return {};
  }
  return {};
}


/* ---------- 9. CONDUZINDO A CONVERSA ---------- */

let ocupado = false;   // impede duas conversas ao mesmo tempo

// Uma "rodada" de conversa.
// textoInicial: undefined = ligar o microfone agora | '' = ouviu só o nome | texto = já ouviu o pedido
async function sessao(textoInicial) {
  if (ocupado) return;
  ocupado = true;
  desligarOuvido();
  limparErro();

  const estavaTocando = memoria.etapa === 'ouvindo_musicas';
  let deveRetomar = false;

  try {
    let texto = textoInicial;

    // se vai precisar ouvir você, pausa a música pra ouvir melhor
    if (texto === undefined || texto === '') {
      if (estavaTocando) { await pausar(); deveRetomar = true; }
      if (texto === '') await falar('Oi! Pode falar.');
      texto = await ouvirUmaVez();
    }

    // vai conversando enquanto o assistente estiver esperando resposta
    while (true) {
      if (!texto) {
        if (memoria.etapa === 'pedindo_nome' || memoria.etapa === 'pedindo_artista') {
          await falar('Não ouvi direito. Toca no microfone e fala de novo.');
        }
        break;
      }
      adicionarBalao('voce', texto);
      const r = await processar(texto);
      if (r.trocouMusica) deveRetomar = false;
      if (!r.ouvirDeNovo) break;
      texto = await ouvirUmaVez();
    }

    if (deveRetomar && memoria.etapa === 'ouvindo_musicas') await retomar();
  } catch (e) {
    await tratarErro(e);
  } finally {
    ocupado = false;
    atualizarTela();
  }
}

// Botões da tela (Adicionar, Próxima…) funcionam como se você tivesse falado
async function acaoRapida(texto) {
  if (ocupado) return;
  ocupado = true;
  desligarOuvido();
  try {
    adicionarBalao('voce', texto);
    await processar(texto);
  } catch (e) {
    await tratarErro(e);
  } finally {
    ocupado = false;
    atualizarTela();
  }
}

// MODO MÃOS LIVRES: fica ouvindo sem parar e só reage quando ouve o nome
let maosLivres = false;
async function loopMaosLivres() {
  while (maosLivres) {
    if (ocupado) { await esperar(400); continue; }
    const ouvido = await ouvirUmaVez(false);
    if (!maosLivres) break;
    if (!ouvido || ocupado) continue;

    const frase = normalizar(ouvido);
    const nome = normalizar(nomeAssistente());
    const pos = frase.indexOf(nome);
    if (!nome || pos === -1) continue;               // não chamou pelo nome: ignora

    const resto = frase.slice(pos + nome.length).trim();   // o pedido depois do nome
    await sessao(resto);
  }
}

function nomeAssistente() {
  return document.getElementById('nomeAssistente').value.trim() || 'Gabriel';
}

// Explica os erros em português
async function tratarErro(e) {
  console.error(e);
  if (e.message === 'SEM_APARELHO') return;             // já foi explicado falando
  if (e.message === 'SEM_LOGIN') {
    await falar('Preciso que você conecte o Spotify primeiro.');
    atualizarTela();
    return;
  }
  if (e.status === 401) {
    salvar('token', null);
    await falar('Seu login no Spotify venceu. Conecta de novo, por favor.');
    atualizarTela();
    return;
  }
  if (e.status === 403) {
    mostrarErro('erroGeral', 'O Spotify recusou o pedido (403): ' + e.message);
    await falar('O Spotify não deixou fazer isso. Deixei o detalhe na tela.');
    return;
  }
  mostrarErro('erroGeral', 'Detalhe do erro: ' + e.message);
  await falar('Deu um probleminha com o Spotify. Deixei o detalhe na tela.');
}


/* ---------- 10. TELA ---------- */

function adicionarBalao(quem, texto) {
  const caixa = document.getElementById('conversa');
  const b = document.createElement('div');
  b.className = 'balao ' + quem;
  b.textContent = texto;
  caixa.appendChild(b);
  caixa.scrollTop = caixa.scrollHeight;
}

function indicarOuvindo(sim) {
  document.getElementById('mic').classList.toggle('ouvindo', sim);
}

function mostrarErro(id, texto) { document.getElementById(id).textContent = texto; }
function limparErro() { mostrarErro('erroGeral', ''); }

function atualizarTela() {
  const conectado = !!(ler('token', null) || {}).acesso;
  document.getElementById('configuracao').classList.toggle('oculto', conectado);
  document.getElementById('desconectar').classList.toggle('oculto', !conectado);

  const status = document.getElementById('status');
  if (!Reconhecimento) status.textContent = '⚠️ Este navegador não reconhece voz. Use o Google Chrome.';
  else if (!conectado) status.textContent = 'Conecte o Spotify pra começar.';
  else status.textContent = `Toque no 🎤 e fale: "quero montar uma playlist".`;

  // cartão "tocando agora"
  const tocandoCartao = document.getElementById('tocando');
  const m = memoria.musicas[memoria.indice];
  const mostrar = memoria.etapa === 'ouvindo_musicas' && m;
  tocandoCartao.classList.toggle('oculto', !mostrar);
  if (memoria.playlist) {
    document.getElementById('nomePlaylist').textContent =
      `Playlist: ${memoria.playlist.nome} · ${memoria.adicionadas.size} adicionada(s)`;
  }
  if (m) {
    document.getElementById('nomeMusica').textContent = m.nome;
    document.getElementById('nomeArtista').textContent = m.artistas;
  }
}


/* ---------- 11. LIGANDO TUDO QUANDO A PÁGINA ABRE ---------- */

async function iniciar() {
  // mostra o endereço de retorno pra você cadastrar no Spotify
  document.getElementById('redirectTexto').textContent = REDIRECT_URI;
  document.getElementById('clientId').value = ler('clientId', '');
  document.getElementById('nomeAssistente').value = ler('nomeAssistente', 'Gabriel');

  // carrega as vozes (alguns celulares demoram)
  if (window.speechSynthesis) {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  }

  // voltou do login do Spotify?
  const params = new URLSearchParams(location.search);
  if (params.get('error')) {
    mostrarErro('erroLogin', 'O Spotify recusou o login: ' + params.get('error'));
  }
  if (params.get('code')) {
    try {
      await trocarCodigoPorToken(params.get('code'));
      adicionarBalao('assistente', 'Spotify conectado! Toque no 🎤 e fale: "quero montar uma playlist".');
    } catch (e) {
      mostrarErro('erroLogin', 'Erro no login: ' + e.message);
    }
    history.replaceState(null, '', REDIRECT_URI);   // limpa o "code" do endereço
  }

  // botões
  document.getElementById('conectar').onclick = conectarSpotify;
  document.getElementById('mic').onclick = () => sessao(undefined);
  document.getElementById('copiar').onclick = async () => {
    try { await navigator.clipboard.writeText(REDIRECT_URI); document.getElementById('copiar').textContent = 'Copiado!'; }
    catch (e) { document.getElementById('copiar').textContent = 'Copie à mão'; }
  };
  document.getElementById('nomeAssistente').oninput = e => salvar('nomeAssistente', e.target.value);
  document.querySelectorAll('[data-acao]').forEach(b => {
    b.onclick = () => acaoRapida(b.dataset.acao);
  });
  document.getElementById('maosLivres').onchange = e => {
    maosLivres = e.target.checked;
    if (maosLivres) {
      adicionarBalao('assistente', `Modo mãos livres ligado. Me chama: "${nomeAssistente()}, quero montar uma playlist".`);
      loopMaosLivres();
    } else {
      desligarOuvido();
    }
  };
  document.getElementById('desconectar').onclick = e => {
    e.preventDefault();
    salvar('token', null);
    atualizarTela();
  };

  atualizarTela();
}

iniciar();
</script>
